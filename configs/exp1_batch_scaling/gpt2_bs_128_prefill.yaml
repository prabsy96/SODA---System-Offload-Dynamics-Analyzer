soda_benchmark:
  mode: prefill
  prompt_tokens: 512
  output_tokens: 1
  warmup_steps: 2
  measured_steps: 8
  save_final_prediction: true
model:
  name: gpt2
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  num_heads: 12
  nonlinearity: gelu
  layer_norm_epsilon: 1.0e-05
  fp16_type: cbfloat16
  start_token: 50257
  max_tokens: 1
  max_position_embeddings: 513
runconfig:
  precision_opt_level: 1
  log_steps: 1
  inference_steps: 10
inference_input:
  data_processor: GptHDF5MapDataProcessor
  data_dir: dummy_data_msl512
  batch_size: 128
  micro_batch_size: 128
  drop_last: false
optimizer:
  loss_scaling_factor: 1.0
  log_summaries: false
