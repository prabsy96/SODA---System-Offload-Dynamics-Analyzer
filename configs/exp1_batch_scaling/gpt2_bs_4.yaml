trainer:
  fit:
    train_dataloader:
      batch_size: 4
      data_dir: /cra-1684/example_data_bundle/nlp/slimpajama_shard/train_shuffled_msl2048/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 8
      persistent_workers: true
      prefetch_factor: 10
      shuffle: false
      shuffle_seed: 1337
    val_dataloader: &id001
      batch_size: 4
      data_dir: /cra-1684/example_data_bundle/nlp/slimpajama_shard/train_shuffled_msl2048/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 0
      shuffle: false
  init:
    backend:
      backend_type: CSX
    callbacks:
    - ScopedTrainFlags:
        csx.performance.micro_batch_size: 4
    - ScopedValidateFlags:
        csx.performance.micro_batch_size: 4
    - ComputeNorm: {}
    - LoadCheckpointStates:
        load_checkpoint_states: model
    checkpoint:
      disable_strict_checkpoint_loading: true
      save_initial_checkpoint: false
      steps: 10
    logging:
      log_steps: 1
    loop:
      eval_frequency: 2384
      eval_steps: 2
      max_steps: 10
    model:
      attention_dropout_rate: 0.1
      dropout_rate: 0.1
      embedding_dropout_rate: 0.1
      hidden_size: 768
      layer_norm_epsilon: 1.0e-05
      loss_scaling: num_tokens
      loss_weight: 1.0
      max_position_embeddings: 1024
      name: gpt2
      nonlinearity: gelu
      num_heads: 12
      num_hidden_layers: 12
      use_bias_in_output: false
      vocab_size: 50257
    optimizer:
      Adam:
        betas:
        - 0.9
        - 0.95
        correct_bias: true
        weight_decay: 0.1
    precision:
      enabled: true
      fp16_type: cbfloat16
      log_loss_scale: true
      loss_scaling_factor: dynamic
      max_gradient_norm: 1.0
    schedulers:
    - LinearLR:
        end_learning_rate: 7.5e-05
        initial_learning_rate: 0.0
        total_iters: 4768
    seed: 1
  validate:
    val_dataloader: *id001
  validate_all:
    val_dataloaders: *id001
