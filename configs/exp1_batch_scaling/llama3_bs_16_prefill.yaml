soda_benchmark:
  mode: prefill
  prompt_tokens: 512
  output_tokens: 1
  warmup_steps: 5
  measured_steps: 30
  save_final_prediction: true
model:
  name: llama
  vocab_size: 128256
  hidden_size: 2048
  num_hidden_layers: 16
  num_heads: 32
  filter_size: 8192
  nonlinearity: swiglu
  norm_type: rmsnorm
  layer_norm_epsilon: 1.0e-05
  position_embedding_type: rotary
  rotary_dim: 64
  rope_theta: 500000.0
  fp16_type: cbfloat16
  pos_scaling_type: llama3
  pos_scaling_factor: 32.0
  pos_scaling_extra_args:
    high_freq_factor: 4.0
    low_freq_factor: 1.0
    original_max_position_embeddings: 8192
  start_token: 128256
  max_tokens: 1
  max_position_embeddings: 513
runconfig:
  precision_opt_level: 1
  log_steps: 1
  inference_steps: 35
inference_input:
  data_processor: GptHDF5MapDataProcessor
  data_dir: dummy_data_msl512
  batch_size: 16
  micro_batch_size: 16
  drop_last: false
optimizer:
  loss_scaling_factor: 1.0
  log_summaries: false
