trainer:
  fit:
    train_dataloader:
      batch_size: 1
      data_dir: /cra-1684/example_data_bundle/nlp/slimpajama_shard/train_shuffled_msl2048/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 8
      persistent_workers: true
      prefetch_factor: 10
      shuffle: false
      shuffle_seed: 1337
    val_dataloader: &id001
      batch_size: 1
      data_dir: /cra-1684/example_data_bundle/nlp/slimpajama_shard/train_shuffled_msl2048/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 0
      shuffle: false
  init:
    backend:
      backend_type: CSX
    callbacks:
    - ScopedTrainFlags:
        csx.performance.micro_batch_size: 1
    - ScopedValidateFlags:
        csx.performance.micro_batch_size: 1
    - ComputeNorm: {}
    - LoadCheckpointStates:
        load_checkpoint_states: model
    checkpoint:
      disable_strict_checkpoint_loading: true
      save_initial_checkpoint: false
      steps: 10
    logging:
      log_steps: 1
    loop:
      eval_frequency: 2384
      eval_steps: 2
      max_steps: 10
    model:
      attention_dropout_rate: 0.0
      attention_module: multiquery_attention
      attention_type: scaled_dot_product
      dropout_rate: 0.0
      embedding_dropout_rate: 0.0
      embedding_layer_norm: false
      extra_attention_params:
        num_kv_groups: 8
      filter_size: 8192
      hidden_size: 2048
      initializer_range: 0.02
      layer_norm_epsilon: 1.0e-05
      loss_scaling: num_tokens
      loss_weight: 1.0
      max_position_embeddings: 2048
      name: llama
      nonlinearity: swiglu
      norm_type: rmsnorm
      num_heads: 32
      num_hidden_layers: 16
      pos_scaling_extra_args:
        high_freq_factor: 4.0
        low_freq_factor: 1.0
        original_max_position_embeddings: 2048
      pos_scaling_factor: 8.0
      pos_scaling_type: llama3
      position_embedding_type: rotary
      rope_theta: 500000.0
      rotary_dim: 128
      share_embedding_weights: false
      use_bias_in_output: false
      use_ffn_bias: false
      use_ffn_bias_in_attention: false
      use_projection_bias_in_attention: false
      vocab_size: 128256
    optimizer:
      Adam:
        betas:
        - 0.9
        - 0.95
        correct_bias: true
        weight_decay: 0.1
    precision:
      enabled: true
      fp16_type: cbfloat16
      log_loss_scale: true
      loss_scaling_factor: dynamic
      max_gradient_norm: 1.0
    schedulers:
    - LinearLR:
        end_learning_rate: 7.5e-05
        initial_learning_rate: 0.0
        total_iters: 4768
    seed: 1
  validate:
    val_dataloader: *id001
  validate_all:
    val_dataloaders: *id001
